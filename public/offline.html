<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #f6f1e7;
        color: #2b2b2b;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { margin: 0; font-size: 0.95rem; opacity: 0.75; max-width: 26rem; }
    </style>
  </head>
  <body>
    <div>
      <h1>You're offline</h1>
      <p>This page needs a connection. Reconnect and try again — anything already loaded stays available.</p>
    </div>
  </body>
</html>
